name: Verificar TDT por satélite
on:
  push:
    branches: [main, fix/tdt-satellite-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build completo y auditoría existente
        run: |
          mkdir -p .quality
          set -o pipefail
          npm run build 2>&1 | tee .quality/build.log
      - name: Servicio, Schema, rutas y servicios anteriores
        run: |
          set -o pipefail
          node --test tests/tdt-satellite.test.mjs 2>&1 | tee .quality/tdt-tests.log
      - name: Preparar comprobación visual
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
      - name: Verificar el servicio en móvil y escritorio sin JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from threading import Thread
          from playwright.sync_api import sync_playwright

          class QuietHandler(SimpleHTTPRequestHandler):
              def log_message(self, *_args):
                  pass

          root = Path('public').resolve()
          out = Path('.quality')
          towns = json.loads(Path('src/localidades.json').read_text(encoding='utf8'))
          town = next((t for t in towns if t['slug'] == 'galdakao'), towns[0])
          town_path = '/' + town['provinciaSlug'] + '/' + town['slug'] + '/'
          server = ThreadingHTTPServer(('127.0.0.1', 0), partial(QuietHandler, directory=str(root)))
          Thread(target=server.serve_forever, daemon=True).start()
          origin = f'http://127.0.0.1:{server.server_port}'
          results = []
          try:
              with sync_playwright() as pw:
                  for engine in ['chromium', 'webkit']:
                      browser = getattr(pw, engine).launch()
                      for width in [390, 1280]:
                          context = browser.new_context(viewport={'width': width, 'height': 900}, java_script_enabled=False)
                          context.route('**/*', lambda route: route.continue_() if route.request.url.startswith(origin) else route.abort())
                          page = context.new_page()
                          page.goto(origin, wait_until='load')
                          home_card = page.locator('#servicios article').filter(has=page.get_by_role('heading', name='TDT por satélite HD', exact=True))
                          assert home_card.count() == 1
                          assert home_card.is_visible()
                          page.locator('#servicios').scroll_into_view_if_needed()
                          page.locator('#servicios').screenshot(path=str(out / f'{engine}-{width}-portada-servicios.png'))
                          page.goto(origin + town_path, wait_until='load')
                          card = page.locator('a.card[href="#tdt-satelite"]')
                          assert card.count() == 1 and card.is_visible()
                          assert page.locator('#servicios a.card').count() == 7
                          card.click()
                          assert page.url.endswith('#tdt-satelite')
                          section = page.locator('#tdt-satelite')
                          assert section.is_visible()
                          heading = section.locator('h2')
                          assert heading.inner_text() == 'Instalación de TDT por satélite en HD en ' + town['localidad']
                          box = section.bounding_box()
                          assert box and box['x'] >= -1 and box['x'] + box['width'] <= width + 1
                          section.screenshot(path=str(out / f'{engine}-{width}-servicio-local.png'))
                          results.append({'engine':engine,'width':width,'route':town_path,'cardVisible':True,'anchorWorks':True,'sectionVisible':True,'javascript':False})
                          context.close()
                      browser.close()
              (out / 'visual-report.json').write_text(json.dumps({'passed':True,'cases':results},ensure_ascii=False,indent=2),encoding='utf8')
              print('TDT-SAT VISIBLE: portada y municipio, móvil y escritorio, Chromium y WebKit; enlaces operativos sin JavaScript.')
          finally:
              server.shutdown()
              server.server_close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdt-satellite-quality
          path: .quality/
          include-hidden-files: true
