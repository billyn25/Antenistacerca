[build]
  command = "npm run build && node scripts/regional-contact-entry.mjs"
  publish = "public"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Solo la publicación de producción permite indexación.
[context.production]
  command = "npm run build:prod && node scripts/regional-contact-entry.mjs"

[context.deploy-preview]
  command = "npm run build && node scripts/regional-contact-entry.mjs"

[context.branch-deploy]
  command = "npm run build && node scripts/regional-contact-entry.mjs"


# Los archivos de rastreo deben revalidarse en cada deploy para que buscadores
# vean rápidamente cambios de indexación y sitemaps.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/sitemaps/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Consolidar la portada duplicada sin cambiar las URLs municipales.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
