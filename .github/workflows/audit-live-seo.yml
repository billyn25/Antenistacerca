name: Auditoría HTTP AntenistaCerca
on:
  workflow_dispatch:
  push:
    branches: [refactor-limpieza-segura]
    paths:
      - '.github/workflows/audit-live-seo.yml'
jobs:
  live-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Auditar URLs publicadas, canonicals, sitemaps y robots
        run: node audit-live-seo.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antenistacerca-live-seo
          path: antenistacerca-live-seo-report.json
          if-no-files-found: warn
