name: Recuperar fuentes completas de Madrid
on:
  push:
    branches: [review/madrid-seo-20261005]
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Recuperar la configuración que ya superó ambos builds
        run: |
          mkdir -p .quality
          python3 - <<'PY'
          import subprocess,textwrap
          previous=subprocess.check_output(['git','show','904ef8c4923c2808cffc9694d4ff2074f81aa192:.github/workflows/madrid-seo-review.yml'],text=True)
          script=previous.split("python3 - <<'PY'\n",1)[1].split('\n          PY',1)[0]
          exec(compile(textwrap.dedent(script),'reviewed-config','exec'))
          PY
          git add package.json generator.js audit-final.js netlify.toml src/postal-codes-madrid.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Conserva la configuración de Madrid que pasó las auditorías de producción y preview'
          git push origin HEAD:review/madrid-seo-20261005
          git rev-parse HEAD > .quality/source-commit.txt
          git ls-tree -r HEAD > .quality/git-tree.txt
          tar --exclude=.git --exclude=.quality --exclude=node_modules -czf .quality/source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: cerca-madrid-complete-sources
          path: .quality/
          include-hidden-files: true
