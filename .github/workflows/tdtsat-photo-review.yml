name: Verificar fotografía TDT-SAT
on:
  push:
    branches: [fix/tdtsat-foto-refactor]
permissions:
  contents: write
jobs:
  photo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar imagen local de receptor sin repetir parabólica
        run: |
          mkdir -p .quality
          python -m pip install pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from PIL import Image
          import io,hashlib
          url='https://apagonsd.televes.com/assets/imag/zas.png'
          data=urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=30).read()
          assert hashlib.sha256(data).hexdigest()=='60f5af17eaee26ae1d89994debd577039212048c1f2666e81365eeffa1f4ecbd','La imagen del fabricante ha cambiado'
          im=Image.open(io.BytesIO(data)).convert('RGBA')
          assert im.size==(600,189)
          canvas=Image.new('RGBA',(640,360),(245,248,251,255))
          canvas.alpha_composite(im,(20,(360-im.height)//2))
          target=Path('src/assets/receptor-tdt-satelite-hd.webp')
          canvas.convert('RGB').save(target,'WEBP',quality=90,method=6)
          assert target.stat().st_size<100000
          file=Path('generator.js');s=file.read_text()
          old="const PARABOLICA='/assets/parabolica.jpeg';"
          assert s.count(old)==1
          s=s.replace(old,old+"\nconst TDT_SAT_PHOTO='/assets/receptor-tdt-satelite-hd.webp';",1)
          replacements={
            '<img src="${PARABOLICA}" alt="Antena parabólica para recepción de TDT por satélite en ${loc}">':'<img src="${TDT_SAT_PHOTO}" width="640" height="360" loading="lazy" decoding="async" alt="Receptor Televés ZAS HD COMBO para TDT por satélite en ${loc}">',
            '<img src="${PARABOLICA}" alt="Antena parabólica para recepción de TDT por satélite">':'<img src="${TDT_SAT_PHOTO}" width="640" height="360" loading="lazy" decoding="async" alt="Receptor Televés ZAS HD COMBO para TDT por satélite">'
          }
          for a,b in replacements.items():
              assert s.count(a)==1,a
              s=s.replace(a,b,1)
          file.write_text(s)
          docs=Path('docs');docs.mkdir(exist_ok=True)
          docs.joinpath('fotografia-tdt-satelite.md').write_text('# Fotografía de TDT por satélite\n\nFotografía de producto: receptor Televés ZAS HD COMBO, presentado por el fabricante para TDT SAT.\n\nFuente: https://apagonsd.televes.com/\nImagen original: '+url+'\n\nDerechos de la imagen: Televés. No se declara licencia libre ni vinculación oficial con el fabricante. Imagen ilustrativa del equipo; no representa un trabajo realizado ni una acreditación del instalador.\n\nPreparación: imagen original sin cambiar el producto, centrada sobre fondo neutro 640 × 360 y convertida a WebP. Se incluye en src/assets para no descargarla durante los builds ni cargarla desde un servidor externo.\n')
          tests=Path('tests/tdt-satellite-service.test.mjs')
          tests.write_text(tests.read_text()+'''\nconst satellitePhoto='/assets/receptor-tdt-satelite-hd.webp';
          test('TDT-SAT tiene fotografía local propia, distinta de parabólicas, en portada y pueblos',()=>{
            const image=fs.readFileSync(path.join(root,satellitePhoto.slice(1)));
            assert.equal(image.toString('ascii',0,4),'RIFF');
            assert.equal(image.toString('ascii',8,12),'WEBP');
            assert.ok(image.length>1000&&image.length<100000);
            assert.notDeepEqual(image,fs.readFileSync(path.join(root,'assets/parabolica.jpeg')));
            const files=['index.html',...towns.map(d=>`${d.provinciaSlug}/${d.slug}/index.html`)];
            for(const file of files){
              const html=read(file);
              const card=file==='index.html'
                ? [...html.matchAll(/<article\\b[\\s\\S]*?<\\/article>/g)].map(m=>m[0]).find(s=>s.includes('<h3>TDT por satélite HD</h3>'))
                : html.match(/<a class="card" href="#tdt-satelite">[\\s\\S]*?<\\/a>/)?.[0];
              assert.ok(card,`${file}: tarjeta TDT-SAT`);
              assert.ok(card.includes(`src="${satellitePhoto}"`),`${file}: foto del receptor`);
              assert.match(card,/width="640"/);
              assert.match(card,/height="360"/);
              assert.match(card,/alt="Receptor Televés ZAS HD COMBO/);
              assert.ok(!card.includes('parabolica.jpeg'),`${file}: imagen repetida`);
              assert.equal(html.split(`src="${satellitePhoto}"`).length-1,1,`${file}: una sola foto TDT-SAT`);
            }
          });\n''')
          print('Fotografía preparada:',target,target.stat().st_size,'bytes')
          PY
      - name: Build completo de producción y pruebas
        run: |
          set -o pipefail
          npm run build:prod 2>&1 | tee .quality/build.log
          node --check generator.js
      - name: Guardar exclusivamente la foto y sus referencias comprobadas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add generator.js src/assets/receptor-tdt-satelite-hd.webp docs/fotografia-tdt-satelite.md tests/tdt-satellite-service.test.mjs
          git rm .github/workflows/tdtsat-photo-review.yml
          git diff --cached --check
          git commit -m 'Diferencia TDT-SAT con fotografía local del receptor HD en portada y pueblos'
          git push origin HEAD:fix/tdtsat-foto-refactor
          git rev-parse HEAD > .quality/commit.txt
          git diff 49b7487131b904b30627c213409a8d7aab4f558c HEAD --stat > .quality/changes.txt
          cp generator.js .quality/generator.js
          cp tests/tdt-satellite-service.test.mjs .quality/tdt-satellite-service.test.mjs
          cp src/assets/receptor-tdt-satelite-hd.webp .quality/receptor-tdt-satelite-hd.webp
          tar -czf .quality/preview.tar.gz public/index.html public/assets public/bizkaia/galdakao/index.html public/burgos/lerma/index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tdtsat-photo-verified
          path: .quality/
          include-hidden-files: true
