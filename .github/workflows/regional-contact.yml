name: Verificar Madrid, contactos y diseño
on:
  push:
    branches: [refactor-limpieza-segura]
    paths: ['scripts/regional-contact*', 'scripts/madrid-*', 'content/madrid-services.json', 'tests/madrid-*', 'header-brand.mjs', 'hero-full-width.js', 'netlify.toml', '.github/workflows/regional-contact.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regional-contact-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTEXT: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pruebas de contenido y diseño antes de compilar
        run: node --test tests/madrid-district-design.test.mjs tests/madrid-seo-boost.test.mjs
      - name: Generar y auditar producción con URLs existentes preservadas
        run: npm run build:prod && node scripts/regional-contact-entry.mjs
      - name: Preparar muestra y evidencia
        run: |
          zip -q -r .cache/regional-sample.zip public/index.html public/madrid/index.html public/madrid/chamberi/index.html public/madrid/madrid/index.html public/madrid/servicios public/assets/*.css public/assets/*.js
          tar -czf .cache/madrid-sources.tgz scripts content tests src package.json netlify.toml *.js *.mjs .github
      - name: Instalar navegador de comprobación
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install chromium
      - name: Confirmar publicación de Madrid y sus seis servicios
        run: node tests/madrid-seo-live.mjs
      - name: Verificar todas las páginas centrales publicadas y controles norte
        run: node scripts/regional-contact.mjs --live
      - name: Verificar 21 distritos, logo, CSS municipal y móvil
        run: node tests/madrid-district-design-live.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: madrid-seo-contactos-verificados
          path: |
            .cache/regional-*
            .cache/madrid-seo-build.json
            .cache/madrid-seo-live/
            .cache/madrid-sources.tgz
            .cache/district-design-build.json
            .cache/district-design/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
