name: Revision Madrid y SEO Cerca
on:
  push:
    branches: [review/madrid-seo-20261005]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guardar fuentes exactas y datos para pruebas
        run: |
          mkdir -p .quality/sources
          git ls-tree -r HEAD > .quality/git-tree.txt
          tar --exclude=.git --exclude=.quality --exclude=node_modules -czf .quality/source.tar.gz .
          python3 - <<'PY'
          import urllib.request,concurrent.futures,json,re
          from pathlib import Path
          urls={
            'municipios.csv':'https://raw.githubusercontent.com/codeforspain/ds-organizacion-administrativa/master/data/municipios.csv',
            'municipios.json':'https://raw.githubusercontent.com/codeforspain/ds-organizacion-administrativa/1e9c99280ef4d7a12def33cafc3df59d9fc1f688/data/municipios.json',
            'postal-madrid.json':'https://raw.githubusercontent.com/billyn25/antenasrapid/fc7ead70124156c46bda6c28acf5f475bf4d1978/content/postal-codes-madrid.json',
            'home.html':'https://antenistacerca.es/',
            'www-home.html':'https://www.antenistacerca.es/',
            'robots.txt':'https://antenistacerca.es/robots.txt',
            'sitemap.xml':'https://antenistacerca.es/sitemap.xml',
            'lerma.html':'https://antenistacerca.es/burgos/lerma/',
            'galdakao.html':'https://antenistacerca.es/bizkaia/galdakao/'
          }
          def read(item):
            name,url=item
            try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; site-owner-audit)'}),timeout=30) as r:
                body=r.read();Path('.quality/sources',name).write_bytes(body)
                txt=body.decode('utf-8','replace')
                return {'file':name,'url':url,'finalUrl':r.url,'status':r.status,'xRobotsTag':r.headers.get('X-Robots-Tag'),'contentType':r.headers.get('Content-Type'),'bytes':len(body),'title':re.findall(r'<title>(.*?)</title>',txt),'robots':re.findall(r'<meta[^>]+name=[\"\']robots[\"\'][^>]*>',txt),'canonical':re.findall(r'<link[^>]+rel=[\"\']canonical[\"\'][^>]*>',txt)}
            except Exception as e:return {'file':name,'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: report=list(pool.map(read,urls.items()))
          Path('.quality/live-audit.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          print(json.dumps(report,ensure_ascii=False))
          PY
      - name: Build de referencia de la rama limpia
        run: |
          npm run build:prod > .quality/build-production.log 2>&1
          tar -czf .quality/public.tar.gz public
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cerca-madrid-baseline
          path: .quality/
          include-hidden-files: true
